# os.yaml — Market Intelligence OS
# Rebuilt from the n8n workflow "Daily Market Intelligence - WhatsApp Report" and its dashboard (docs/source/).
#   verbs: a weekday 06:00 IST run fetches 5 RSS feeds → CODE parse/dedupe/categorise/impact (rule zero) → ONE AI call writes the
#          market commentary as typed fields → CODE formats the WhatsApp text → the report + its articles are rows → broadcast to every
#          active, opted-in subscriber (approved template) → each delivery logged; a failed run alerts the admins. The analyst reviews,
#          re-runs, resends.
#   SEBI (owner decision, 15 Oct 2026): COMMENTARY ONLY — no buy/sell calls, strikes, targets or stop-losses (docs/00-decisions.md).
#   flows: all four are custom pipelines (method/ai-pipeline.md; tools/build_market_flows.py) — DAILY_SCHEDULE · MARKET_REPORT ·
#          BROADCAST (send · retry). Architect review 15 Oct 2026 applied (WORKLOG #3).
os:
  name: Market Intelligence
  slug: market-intel-os
  client: Market Intelligence — Daily pre-market report for NSE/BSE traders
  mode: client
  one_liner: A Daily Market Intelligence report reaches every subscriber on WhatsApp before the market opens at 9:15 AM IST, and the analyst sees and fixes anything that failed.
  tagline: Five news sources, one AI market outlook, every trading morning at 6:00 AM IST.
  languages: [en]
  volume_per_month: 30
  success_metric: Report delivered to every active subscriber by 06:15 IST on every trading day; a failed run seen by an analyst before 07:00
  plan: team
  brand: { color: "#0B8F6A", name: Market Intelligence }
  auth_otp: false
  audit: true
  seed_dates: today
  limits: { actions_per_day: 200, public_actions_per_hour: 1 }

design:
  tone: pucho
  shell: sidebar
  direction: "Analysts read one dense report each morning; numbers in mono, status carries the colour, dark mode for the early start"
  sidebar: { footer: profile }
  powered_by: false            # the floating badge covered row content on desktop and mobile (qaqc 15 Oct); kernel ticket K12

requirements:
  - { id: R1,  text: "Schedule Trigger runs the report Mon–Fri at 6:00 AM IST" }
  - { id: R2,  text: "Fetch ET Markets, Moneycontrol, Reuters India, Google Finance News and Global Market Cues RSS; a failed source does not stop the run" }  # owner 15 Oct: the three dead feeds are read through Google News scoped to the publisher
  - { id: R3,  text: "Parse every RSS item into title, summary (HTML stripped, up to 300 characters), date and source" }
  - { id: R4,  text: "Deduplicate news by the first 60 characters of the normalised title" }
  - { id: R5,  text: "Categorize news as Macro Economic, Benchmark Index, Banking Sector, IT Sector, Pharma Sector, Auto Sector, Commodity, Global Cues, F&O or General Market" }
  - { id: R6,  text: "Keep the 40 most relevant articles and count them by category" }
  - { id: R7,  text: "AI analysis as a senior Indian stock market analyst: sentiment, confidence, drivers, segment-wise analysis, top sectors, key risks, trading strategy" }
  - { id: R8,  text: "Format the WhatsApp message with the day, date and report time in IST, the analysis and the footer Market Opens: 9:15 AM IST, within the WhatsApp limit" }
  - { id: R9,  text: "Send the report on WhatsApp" }
  - { id: R10, text: "Log the result: status, WhatsApp message id, sent at, report date" }
  - { id: R11, text: "Send an error alert on WhatsApp when the report cannot be generated" }
  - { id: R12, text: "Show the workflow pipeline with each step's status and the error branch" }
  - { id: R13, text: "Show today's market sentiment: sentiment, confidence, key market drivers, news analyzed, AI model, report generated time, sources" }
  - { id: R14, text: "Show the stats row: Sensex expected move, Nifty expected move, India VIX, FII net buy" }
  - { id: R15, text: "Show segment-wise analysis cards: Sensex, Nifty 50, Bank Nifty, Nifty F&O (VIX, PCR), Mid & Small Cap, Commodities (gold, crude)" }
  - { id: R16, text: "Show the sector watch: sector, call (BUY / WATCH / AVOID), previous performance, key reason" }
  - { id: R17, text: "Show the trading strategy (positional, intraday, long-term, F&O traders) and key risks today with their level" }
  - { id: R18, text: "Show the news feed with category filter chips, impact, source and time" }
  - { id: R19, text: "Show the active news sources" }
  - { id: R20, text: "Show the WhatsApp delivery preview" }
  - { id: R21, text: "Show the workflow configuration: schedule, timezone, AI model, temperature, max tokens, news limit, WhatsApp API, delivery days, error handling" }
  - { id: R22, text: "Show a live ticker, the IST clock and the market-open countdown" }
  - { id: R23, text: "Every report and screen carries the disclaimer: AI analysis only, not SEBI-registered investment advisory" }
  - { id: R24, text: "The analyst reviews and edits today's report, re-runs it, and resends it" }
  - { id: R25, text: "Subscribers sign in to read today's report and past reports" }
  - { id: R26, text: "The analyst adds, pauses and removes WhatsApp subscribers" }
  - { id: R27, text: "Failed runs and failed deliveries land in an exception queue for a person" }
  - { id: R28, text: "Production launch: sign-in, roles, audit log, security baseline, deployable bundle" }

portals:
  - { id: desk,   label: Market Desk, base: /,   roles: [admin, analyst] }
  - { id: reader, label: My Reports,  base: /me, roles: [subscriber], shell: sidebar }

roles:
  - { key: admin,      label: Admin,          desc: "Runs the desk, people and roles, and sees the audit log", home: /,      demo: { email: admin@marketintel.pucho.ai,   password: Admin@2026mi,  name: Kashyap Mehta } }
  - { key: analyst,    label: Market Analyst, desc: "Checks the 6 AM report, edits it, re-runs it and sends it to subscribers", home: /today, demo: { email: analyst@marketintel.pucho.ai, password: Analyst@2026mi, name: Riya Desai } }
  - { key: subscriber, label: Subscriber,     desc: "Reads today's report and past reports",               home: /me,     demo: { email: reader@marketintel.pucho.ai,  password: Reader@2026mi, name: Amit Shah } }

journeys:
  - { role: analyst,    does: "Check the 6 AM report and send it",              lands: today,       steps: ["Today's report opens on the sentiment and segments", "Review & edit on the report row (only if a view needs changing)", "Send to subscribers on the same row"] }
  - { role: analyst,    does: "Recover a failed run",                           lands: pipeline,    steps: ["Pipeline opens on the run log, Failed segment", "Read the error and source counts on the row", "Re-run report now on the row"] }
  - { role: admin,      does: "Clear this morning's exceptions",                lands: overview,    steps: ["Overview opens on Needs action", "Send / Retry delivery / Re-run on the row"] }
  - { role: admin,      does: "Add a subscriber",                               lands: subscribers, steps: ["Subscribers → Add subscriber", "Name, email, opt-in date and how they opted in → Add"] }
  - { role: subscriber, does: "Read today's report before the open",            lands: me_today,    steps: ["Today's report opens on sentiment, drivers and segments", "Scroll to sectors, risks, the market view and news"] }

entities:
  # ── The desk's working copy: every run, including drafts and failures. Never on a subscriber page. ─────────────────────
  - name: reports
    id: { column: Report_ID, prefix: "MIR-" }
    title: Report_Date
    subtitle: [Sentiment]
    created: Created_At
    status: { column: Status, values: [Ready, Sent, Failed] }
    transitions:
      Ready:  [Sent, Failed]
      Failed: [Ready]
      Sent:   [Sent]
    requires_on:
      Ready:  [Sentiment, Confidence_Level, Driver_1, WhatsApp_Message]
      Sent:   [Sentiment, Confidence_Level, Driver_1, WhatsApp_Message]
      Failed: [Error_Message]
    columns: [Report_ID, Report_Date, Created_At, Trigger, Status, Sentiment, Confidence_Level, Confidence_Pct,
              Driver_1, Driver_2, Driver_3,
              Sensex_Outlook, Sensex_Range, Sensex_Reason, Nifty_Outlook, Nifty_Range, Nifty_Reason,
              BankNifty_Outlook, BankNifty_Range, BankNifty_Reason, FnO_View, VIX_Expectation, FnO_Reason,
              MidSmall_Outlook, MidSmall_Focus, MidSmall_Reason, Commodity_Outlook, Commodity_Reason,
              Sectors, Risks, View_Positional, View_Intraday, View_LongTerm, View_FnO,
              Articles_Analyzed, Category_Breakdown, Source_Status, Model, WhatsApp_Message, Message_Length,
              Sent_At, Sent_Count, Failed_Count, Error_Message]
    fields:
      Report_Date:       { type: date, unique: true }
      Status:            { one_of: [Ready, Sent, Failed] }
      Trigger:           { one_of: [Schedule, Manual] }
      Sentiment:         { one_of: [BULLISH, CAUTIOUSLY BULLISH, NEUTRAL, CAUTIOUSLY BEARISH, BEARISH] }
      Confidence_Level:  { one_of: [HIGH, MEDIUM, LOW] }
      Confidence_Pct:    { type: number, min: 0, max: 100, integer: true }
      Sensex_Outlook:    { one_of: [BULLISH, BEARISH, NEUTRAL, CAUTIOUS] }
      Nifty_Outlook:     { one_of: [BULLISH, BEARISH, NEUTRAL, CAUTIOUS] }
      BankNifty_Outlook: { one_of: [BULLISH, BEARISH, NEUTRAL, CAUTIOUS] }
      MidSmall_Outlook:  { one_of: [BULLISH, BEARISH, NEUTRAL, CAUTIOUS] }
      Commodity_Outlook: { one_of: [BULLISH, BEARISH, NEUTRAL, CAUTIOUS] }
      FnO_View:          { one_of: [BULLISH BIAS, BEARISH BIAS, RANGE-BOUND, VOLATILE] }
      VIX_Expectation:   { one_of: [LOW, MEDIUM, HIGH] }
      Articles_Analyzed: { type: number, min: 0, max: 40, integer: true }
      Message_Length:    { type: number, min: 0, max: 4096, integer: true }
      Sent_Count:        { type: number, min: 0, integer: true }
      Failed_Count:      { type: number, min: 0, integer: true }
    seed: 18
