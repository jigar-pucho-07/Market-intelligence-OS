rules_in_code:
  - { text: "RSS parse, dedupe (first 60 normalised title characters), word-bounded categorisation in the source's order, impact rule and the 40-article cut are deterministic CODE in MARKET_REPORT (S2, S3 fixed)", covers: [R3, R4, R5, R6] }
  - { text: "WhatsApp text is built by one formatter (app/src/custom/lib/market.js) used by the flow and by the app's preview: header with day, date and report time in IST, the analysis, 'Market Opens: 9:15 AM IST', the disclaimer; trimmed to 4,000 characters", covers: [R8, R20, R23] }
  - { text: "A failed run (no articles, model JSON unusable) is a report row with Status Failed and Error_Message; MARKET_REPORT always hands it to BROADCAST, which sends the mi_run_failed alert to constants.alert_to; the 06:20 watchdog alerts when no row exists at all — replaces the source's Error Trigger, which could never fire (S6)", covers: [R11, R27] }
  - { text: "Subscriber messages are business-initiated, so they use the approved template mi_daily_report (Meta refuses free text outside the 24-hour window, S5); only Active subscribers with an opt-in date and source receive it; one delivery per report per subscriber (unique), so a resend never duplicates", covers: [R9, R26] }
  - { text: "SEBI (owner decision 15 Oct 2026): commentary only — the prompt forbids buy/sell calls, strikes, targets and stop-losses; the source's BUY CALLS / BUY PUTS, BUY / AVOID and 'trading strategy' become an F&O positioning view, sectors POSITIVE / WATCH / NEGATIVE and a market view per trader type; the disclaimer is on every report, document, the reader portal and the template", covers: [R7, R16, R17, R23] }
  - { text: "Subscribers read only published_reports (a reader-safe copy BROADCAST writes when a report is sent) and today's news; drafts, failures, deliveries, subscribers and the audit log are not on any subscriber page, so the server never loads them for that role", covers: [R25, R28] }
  - { text: "Every write by a person or a flow lands in the audit log; sign-in, roles, server-side scope and the §19 baseline ship with v1; go-live requires /api/health to report every flow wired (an unwired flow is simulated and labelled SIMULATED in the header and the row)", covers: [R28] }

not_in_v1:
  - { text: "Live ticker values (Sensex, Nifty, Bank Nifty, Nifty IT, VIX, USD/INR, Gold, Crude, SGX Nifty, FII, Dow, NASDAQ), IST clock and market-open countdown — the source has no market-data feed; needs a licensed NSE/BSE data API (G5). v1 shows the AI's ranges in focus", covers: [R22] }
  - { text: "Stats row figures — Sensex/Nifty expected move in points, India VIX level, FII net buy amount — need the same market-data feed (G5); v1 shows the ranges and the VIX expectation (LOW/MEDIUM/HIGH) from the analysis", covers: [R14] }
  - { text: "Sector 'previous performance' %, PCR ratio and gold / crude prices on the segment cards — not in the news data; need the market-data feed (G5)", covers: [R15, R16] }
  - { text: "A 'Stop' quick-reply on the template that unsubscribes automatically — needs an inbound WhatsApp webhook; v1: the analyst sets Unsubscribed when a subscriber replies STOP", covers: [R26] }
