flows:
  # ── The 06:00 IST trigger — a custom flow (schedule → MARKET_REPORT async → Return); 06:20 watchdog in the same flow file ─
  - name: DAILY_SCHEDULE
    covers: [R1, R11]
    trigger: { tool: schedule, name: every_day }
    constants: { hour_of_the_day: 6, timezone: Asia/Kolkata, run_on_weekends: false, holidays: [] }
    writes: [reports]
    actions:
      - name: trigger
        model: none
        via: custom
        payload: { Trigger: string }
        result: { queued: boolean }
        rules:
          - "every_day at 06:00 Asia/Kolkata, weekends off; a date in constants.holidays (NSE trading holidays, ⚑ G3 — the owner fills the list from the NSE circular) skips the run → POST MARKET_REPORT {Trigger: Schedule} without /sync (the run is longer than the 25 s sync window) → Return. Fixes S1 (the source ran at 00:30 IST)"
        typical_seconds: 4
        credits: 5
        runs_per_month: 22

  # ── The daily report — a custom pipeline (5 fetches → CODE → router → one AI call → CODE → writes → BROADCAST) ─────────
  - name: MARKET_REPORT
    covers: [R1, R2, R3, R4, R5, R6, R7, R8, R10]
    trigger: { tool: webhook, name: catch_webhook, auth: none }
    constants: { news_limit: 40, summary_chars: 300, dedupe_chars: 60, max_age_hours: 48, auto_send: true }
    writes: [reports, news_articles]
    actions:
      - name: run
        model: none
        async: true
        via: custom
        payload: { Trigger: string, Report_ID: string }
        result: { Report_ID: string, Status: string, Articles_Analyzed: number }
        rules:
          - "The door (owner fix round 1, SA-01..03): ?k= secret checked first (401), action validated (400), today's report state read before any spend (run with today Ready/Sent → 409; rerun only when today is Failed) → POST MARKET_ANALYSE ?k=. Steps below run in MARKET_ANALYSE"
          - "Five RSS fetches run as separate steps; a failed or empty source yields 0 items and is reported in Source_Status, never stops the run (CODE)"
          - "Parse <item> title / description (CDATA or plain, HTML stripped, ≤300 chars) / pubDate / link; dedupe on the first 60 lower-cased alphanumeric title characters; categorise with word-bounded keyword rules in the source's order; keep 40 (CODE — fixes S2, S3)"
          - "Impact: HIGH when the title names RBI, repo, Fed, FII, GDP, CPI, inflation, SGX/GIFT Nifty or a ≥ $1 billion deal; MED for Banking, IT, F&O, Benchmark; else LOW (CODE)"
          - "ONE AI call (Studio llm-ai, model class standard, temperature 0.3, 2,000 tokens) under the DATA RULE: senior Indian market analyst, COMMENTARY ONLY — sentiment, confidence, drivers, segment outlooks with the range in focus, F&O positioning view, sectors POSITIVE / WATCH / NEGATIVE, risks HIGH / MED, a market view per trader type; never a buy/sell call, strike, target or stop-loss (owner decision on SEBI). Prompt: app/src/custom/lib/market.js buildPrompt()"
          - "Zero articles, or model JSON missing Sentiment / Confidence_Level / Driver_1 → Status Failed with Error_Message, never a half-empty Ready row (CODE + router on the parse field)"
          - "The model's JSON is parsed and only declared keys are kept; enum values outside the lists become empty; confidence clamped 0–100 (CODE)"
          - "WhatsApp_Message = header (day, date, report time IST) + analysis + footer 'Market Opens: 9:15 AM IST' + disclaimer, trimmed to 4,000 characters (CODE, app/src/custom/lib/market.js — the same formatter the app's preview uses)"
          - "One report per Report_Date (unique). A payload Report_ID re-runs that row (Failed → Ready, PATCH); a Sent report is never re-run (refused). The report is written first, then news_articles with deterministic ids (Report_ID + dedupe key) so a re-run never doubles them"
          - "Last step: POST BROADCAST — always for Failed (the admin alert), for Ready only when constants.auto_send is true; then POST /api/jobs/<id> done"
        typical_seconds: 45
        credits: 6
        runs_per_month: 22
        effect:
          insert: reports
          fill: { Report_Date: now, Trigger: Manual, Status: Ready, Sentiment: NEUTRAL, Confidence_Level: LOW, Confidence_Pct: 0, Model: simulated, Articles_Analyzed: 0,
                  Driver_1: "SIMULATED — the MARKET_REPORT flow is not wired; nothing was fetched or analysed", Driver_2: "Set WEBHOOK_MARKET_REPORT to run the real report", Driver_3: "",
                  WhatsApp_Message: "SIMULATED run — not a market report", Source_Status: "Simulated — no source was fetched" }
          result: { Status: Ready }
      - name: rerun
        model: none
        async: true
        via: custom
        payload: { Report_ID: string }
        result: { Report_ID: string, Status: string, Articles_Analyzed: number }
        rules:
          - "The same pipeline as run, on an existing Failed report: fetch → analyse → PATCH that Report_ID Failed → Ready (or Failed again with the new error); a Sent report is refused"
        typical_seconds: 45
        credits: 6
        runs_per_month: 8
        effect:
          patch: reports
          fill: { Status: Ready, Sentiment: NEUTRAL, Confidence_Level: LOW, Confidence_Pct: 0, Model: simulated, Error_Message: "",
                  Driver_1: "SIMULATED re-run — the MARKET_REPORT flow is not wired; nothing was fetched or analysed",
                  WhatsApp_Message: "SIMULATED run — not a market report", Source_Status: "Simulated — no source was fetched" }
          result: { Status: Ready }

  # ── Broadcast to every active subscriber, the admin alert, and one delivery again — a custom flow ──────────────────────
  - name: BROADCAST
    covers: [R9, R10, R11, R27]
    trigger: { tool: webhook, name: catch_webhook, auth: none }
    constants: { report_template: mi_daily_report, alert_template: mi_run_failed, alert_to: SET_IN_STUDIO_ADMIN_WHATSAPP_NUMBERS, portal_url: SET_IN_STUDIO_APP_URL }
    writes: [reports, published_reports, deliveries]
    actions:
      - name: send
        model: none
        via: custom
        async: true
        payload: { Report_ID: string }
        result: { sent: number, failed: number, skipped: number }
        rules:
          - "Ready report → for each Active subscriber with Opt_In_At and Opt_In_Source: INSERT a Queued delivery (unique Report_Date + Subscriber_ID + Kind; a 409 means already sent → skip) → pucho-whatsapp approved template mi_daily_report (date, sentiment, confidence, first driver; the portal link is the template's URL button) → PATCH the delivery Sent with the message id, or Failed with the error (CODE + LOOP_ON_ITEMS)"
          - "Then POST MARKET_PUBLISH: UPSERT published_reports (the reader-safe columns) and PATCH the report Sent, Sent_At, Sent_Count, Failed_Count (owner trim 15 Oct: no per-subscriber write — the delivery log is the record)"
          - "Failed report → template mi_run_failed (error, date, IST time) to constants.alert_to; a Kind=Alert delivery row; nothing goes to subscribers"
        typical_seconds: 30
        credits: 258
        runs_per_month: 26
        effect: { patch: reports, fill: { Status: Sent, Sent_At: now } }
      - name: retry
        model: none
        via: custom
        payload: { Delivery_ID: string }
        result: { sent: boolean }
        rules:
          - "Reads the delivery and its subscriber; refuses unless the subscriber is Active and opted in, the delivery is a Failed Report and Attempts < 3; increments Attempts; sends the same template to the number on the subscriber record (never a number from the payload); PATCHes the same delivery row Sent or Failed"
        typical_seconds: 6
        credits: 13
        runs_per_month: 20
        effect: { patch: deliveries, fill: { Status: Sent, Sent_At: now, Error_Message: "" }, result: { sent: true } }

  # ── Helper flows the budget required (one trigger per Studio flow; ≤14 steps per path) — workflow agent, 15 Oct 2026 ──
  - name: DAILY_WATCHDOG
    covers: [R11]
    trigger: { tool: schedule, name: cron_expression }
    constants: { cron: "20 6 * * 1-5", timezone: Asia/Kolkata, holidays: [] }
    writes: [reports]
    actions:
      - name: check
        model: none
        via: custom
        payload: {}
        result: { alerted: boolean }
        rules: ["06:20 IST Mon–Fri: GET reports; no row for today (or the app unreadable) → POST BROADCAST {action: send, Kind: Alert, Error_Message} → Return — a crashed run still alerts the admins"]
        typical_seconds: 4
        credits: 5
        runs_per_month: 22
  - name: MARKET_ANALYSE
    covers: [R2, R3, R4, R5, R6, R7, R8]
    trigger: { tool: webhook, name: catch_webhook, auth: none }
    constants: { news_limit: 40, summary_chars: 300, dedupe_chars: 60, max_age_hours: 48, webhook_secret: SET_IN_STUDIO_WEBHOOK_SECRET }
    writes: [reports]
    actions:
      - name: run
        model: none
        async: true
        via: custom
        payload: { Trigger: string, Report_ID: string }
        result: { Status: string, Articles_Analyzed: number }
        rules: ["Called only by MARKET_REPORT (?k= secret checked first, 401 otherwise). Five RSS GETs (feeds.* constants, Google News per publisher) → parse / dedupe / categorise / impact → no news → Failed row; else ONE llm-ai call (model class standard) → parse + advice check → POST MARKET_STORE ?k="]
        typical_seconds: 45
        credits: 19
        runs_per_month: 22
      - name: rerun
        model: none
        async: true
        via: custom
        payload: { Report_ID: string }
        result: { Status: string, Articles_Analyzed: number }
        rules: ["As run, for today's Failed report"]
        typical_seconds: 45
        credits: 19
        runs_per_month: 8
  - name: MARKET_STORE
    covers: [R10]
    trigger: { tool: webhook, name: catch_webhook, auth: none }
    constants: { auto_send: true }
    writes: [reports, news_articles]
    actions:
      - name: store
        model: none
        via: custom
        payload: { Mode: string, Trigger: string, Report_ID: string }
        result: { Report_ID: string, Status: string }
        rules: ["Called only by MARKET_REPORT with the finished report and articles. run: no row today → POST; today's row Failed → PATCH it; Ready / Sent → refused. rerun: only a Failed report of today; Sent refused. Then news_articles (NWS-<Report_ID>-<hash>), BROADCAST (Failed → Kind Alert; Ready → only when auto_send), POST /api/jobs/<_job>"]
        typical_seconds: 5
        credits: 12
        runs_per_month: 30
  - name: MARKET_PUBLISH
    covers: [R9, R10]
    trigger: { tool: webhook, name: catch_webhook, auth: none }
    constants: {}
    writes: [reports, published_reports]
    actions:
      - name: publish
        model: none
        via: custom
        payload: { Report_ID: string, Since: string }
        result: { sent: number, failed: number }
        rules: ["Called only by BROADCAST (after send and after retry). From the app's rows: report Sent + Sent_At + Sent_Count + Failed_Count; UPSERT published_reports (POST, then PATCH); POST /api/jobs/<_job> done. A Failed or unknown report writes nothing"]
        typical_seconds: 6
        credits: 12
        runs_per_month: 46

